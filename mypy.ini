[mypy]
python_version = 3.12
strict = true
plugins = pydantic.mypy

# Per-module overrides for third-party libraries without stubs
[mypy-uvicorn.*]
ignore_missing_imports = true

[mypy-alembic.*]
ignore_missing_imports = true

[mypy-passlib.*]
ignore_missing_imports = true

[mypy-apscheduler.*]
ignore_missing_imports = true
