# generated_by: forge:architect-context-mapping
# generated_at: 2026-06-12
# tier: large

contexts:

  - id: CTX-001
    name: Catalog
    description: >
      Owns the shared, authoritative library of food Products, Recipes, and Diet patterns.
      Everything related to browsing, searching, creating, editing, and deleting catalog
      entries — including nutritional data, dietary-compatibility tagging, and the
      weekly-selection flag — lives here. Products and Recipes are the upstream reference
      data that all other contexts consume by ID. This context is the most stable: its
      data changes only when users curate entries, not when they plan or log meals.
    capabilities:
      - CAP-001  # Product catalog management
      - CAP-002  # Dietary tagging
      - CAP-003  # Recipe management
    aggregates:
      - AGG-001  # Product
      - AGG-002  # Recipe
    ubiquitous_language:
      - TERM-001  # Product
      - TERM-002  # Recipe
      - TERM-003  # Diet
      - TERM-007  # Weekly Selection
      - TERM-011  # Nutrition Breakdown
      - TERM-012  # Ingredient Line
      - TERM-014  # Nutritionist
      - TERM-015  # Serving (recipe definition)
      - TERM-016  # Catalog
      - TERM-017  # Favorite
    exposed_events:
      - EVT-001   # ProductCreated
      - EVT-002   # ProductUpdated
      - EVT-003   # ProductDeleted
      - EVT-004   # ProductMarkedForWeek
      - EVT-005   # ProductUnmarkedFromWeek
      - EVT-013   # RecipeMarkedForWeek
      - EVT-014   # RecipeUnmarkedFromWeek
    external_dependencies:
      - EXT-001   # OpenAIApi (recipe import parsing)
      - EXT-002   # ProductDatasetProvider (catalog seeding)

  - id: CTX-002
    name: Identity
    description: >
      Owns user registration, authentication, credentials, and the personal profile —
      language preference, unit system, body metrics, diet preferences, and the derived
      calorie corridor. This context is the single source of truth for who the user is
      and how they want the application to behave. Its lifecycle is independent of all
      other contexts; it has no aggregates that depend on Products, Recipes, or Plans.
    capabilities:
      - CAP-004  # User account management
    aggregates:
      - AGG-003  # UserProfile
    ubiquitous_language:
      - TERM-010  # Calorie Corridor
      - TERM-013  # User
    exposed_events:
      - EVT-016   # UserRegistered
      - EVT-017   # UserCredentialsUpdated
      - EVT-018   # UserProfileUpdated
    external_dependencies:
      - EXT-003   # IdentityProvider (reserved; MVP1 is email/password only)

  - id: CTX-003
    name: Nutrition Tracking
    description: >
      Owns daily meal logging — recording products and recipes consumed on a given date,
      and deriving a running daily nutrition summary compared against the user's calorie
      corridor. The MealLog aggregate lifecycle is entirely user-date scoped; it reads
      product/recipe nutrition data by ID but does not own those entities. Its change
      rate follows daily user habit: high frequency but tightly scoped per user-date.
    capabilities:
      - CAP-005  # Meal logging
    aggregates:
      - AGG-004  # MealLog
    ubiquitous_language:
      - TERM-009  # Meal Log
      - TERM-011  # Nutrition Breakdown (consumption view)
    exposed_events:
      - EVT-019   # MealLogEntryAdded
      - EVT-020   # MealLogEntryUpdated
      - EVT-021   # MealLogEntryDeleted
    external_dependencies: []

  - id: CTX-004
    name: Meal Planning
    description: >
      Owns the weekly planning canvas (MealPlan aggregate) and the derived Shopping List
      (ShoppingList aggregate). Responsible for creating and editing meal plans with
      per-day cards and sections, managing the meal-prep summary pool, assigning items
      to days, controlling servings, and generating or refreshing the shopping list.
      ShoppingList is tightly coupled to MealPlan by invariants INV-015 and INV-016
      and by POL-004 (shopping list goes stale on plan change), making them a cohesive
      unit in this context. This context reacts to weekly-selection events from Catalog
      (POL-002) to automatically populate the summary pool.
    capabilities:
      - CAP-006  # Meal plan organisation
      - CAP-007  # Daily meal scheduling
      - CAP-008  # Shopping list generation
    aggregates:
      - AGG-005  # MealPlan
      - AGG-006  # ShoppingList
    ubiquitous_language:
      - TERM-004  # Meal Plan
      - TERM-005  # Day Card
      - TERM-006  # Meal-Prep Summary
      - TERM-008  # Shopping List
      - TERM-015  # Serving (planning view)
      - TERM-018  # Section
    exposed_events:
      - EVT-022   # MealPlanCreated
      - EVT-023   # MealPlanDateRangeUpdated
      - EVT-024   # ItemAddedToSummary
      - EVT-028   # ItemAssignedToDaySection
      - EVT-029   # ItemMovedBetweenDays
      - EVT-030   # ItemRemovedFromDaySection
      - EVT-031   # DishServingsSet
      - EVT-035   # ShoppingListGenerated
      - EVT-036   # ShoppingListRefreshed
    external_dependencies: []
