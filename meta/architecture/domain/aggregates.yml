# generated_by: forge:architect-domain-extraction
# generated_at: 2026-06-12
# tier: large

aggregates:
  - id: AGG-001
    name: Product
    description: A food item with nutritional data owned by either the global catalog seed or a user. Enforces ownership rules and nutritional data completeness.
    invariants:
      - id: INV-001
        statement: A product must have a non-empty name and a complete nutrition breakdown (calories ≥ 0, protein ≥ 0, fat ≥ 0, carbohydrates ≥ 0).
      - id: INV-002
        statement: Only the user who created a product may edit or delete it; system-seeded products may not be deleted by any non-admin user.

  - id: AGG-002
    name: Recipe
    description: A named dish composed of ingredient lines (each referencing a Product), with a derived nutrition summary, ownership, and optional media. Enforces referential integrity with products and ownership constraints.
    invariants:
      - id: INV-003
        statement: Every ingredient line in a recipe must reference a valid, existing Product.
      - id: INV-004
        statement: The recipe's nutrition summary must equal the sum of (ingredient_line.amount / 100) × product.nutrition_per_100g across all ingredient lines.
      - id: INV-005
        statement: Only the user who created a recipe may edit or delete it; shared/system recipes are protected.

  - id: AGG-003
    name: UserProfile
    description: Holds a user's identity credentials, preferences (language, units, diet), and body metrics. Enforces uniqueness of email and validity of metric values.
    invariants:
      - id: INV-006
        statement: Email must be unique across all user accounts.
      - id: INV-007
        statement: Weight and age must be positive numbers when provided; BMI is derived from weight and height, not stored independently.
      - id: INV-008
        statement: Macro proportions (protein%, fat%, carbohydrate%) must sum to 100 when all three are set.

  - id: AGG-004
    name: MealLog
    description: A daily record of food intake entries (products or recipes with quantities) for a specific user on a specific date. Aggregates nutrition totals for the day.
    invariants:
      - id: INV-009
        statement: Each log entry must reference a valid Product or Recipe that exists in the catalog.
      - id: INV-010
        statement: The daily nutrition summary must equal the sum of each entry's (amount/serving_size) × item.nutrition.

  - id: AGG-005
    name: MealPlan
    description: A date-ranged planning canvas for a user, containing a meal-prep summary pool and per-day cards each with sections and assigned items. The central aggregate of the Meal Planner module.
    invariants:
      - id: INV-011
        statement: The date range must have start_date ≤ end_date.
      - id: INV-012
        statement: An item on a day card must also exist in the summary pool; the summary pool is the authoritative set from which day cards draw.
      - id: INV-013
        statement: If an item is removed from the last day card that references it, it must also be removed from the summary pool.
      - id: INV-014
        statement: Servings per dish on a day card must be ≥ 1.

  - id: AGG-006
    name: ShoppingList
    description: A generated list of product quantities required for a meal plan. Derived from AGG-005 state; refreshable to stay in sync with plan changes.
    invariants:
      - id: INV-015
        statement: Every shopping list item must correspond to a product referenced by at least one meal plan entry within the plan's date range.
      - id: INV-016
        statement: Product quantities in the shopping list must equal the sum of (servings × per_serving_amount) across all day card entries referencing that product for the plan period.
