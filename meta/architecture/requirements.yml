        policy: POL-005
        test: TestDeleteMealLogEntry_NutritionRecalculated

  # ══ Meal Planner ══════════════════════════════════════════════════════════

  - id: FR-027
    statement: A user shall be able to create a meal plan with a date range defaulting to the current calendar week; the plan shall display one day card per day in the range.
    source: [US-MP-001, US-MP-002]
    acceptance:
      - id: AC-074
        given: an authenticated user on 2026-06-12 (a Friday) who creates a plan with default dates
        when: CreateMealPlan is submitted
        then: the plan is persisted with start_date = 2026-06-08 (Mon) and end_date = 2026-06-14 (Sun)
        kind: happy
        invariant: INV-011
        test: TestCreateMealPlan_DefaultsToCurrentWeek
      - id: AC-109
        given: a meal plan created with a 7-day range
        when: the plan's day cards are retrieved
        then: exactly 7 day cards are returned, one per calendar date in the range
        kind: happy
        test: TestCreateMealPlan_SevenDayCards
      - id: AC-075
        given: a plan creation payload with start_date > end_date
        when: CreateMealPlan is submitted
        then: returns HTTP 422 and no plan is created
        kind: negative
        invariant: INV-011
        test: TestCreateMealPlan_RejectsInvertedRange
      - id: AC-076
        given: an existing meal plan P
        when: SetMealPlanDateRange is submitted with a new valid range (3 days)
        then: returns HTTP 200 and the plan now shows 3 day cards for the new range
        kind: happy
        invariant: INV-011
        test: TestSetMealPlanDateRange_UpdatesDayCards

  - id: FR-028
    statement: Products and recipes marked for the current week shall automatically appear in the meal-prep summary pool for plans covering that week.
    source: [US-MP-003]
    acceptance:
      - id: AC-077
        given: product P marked for week 2026-06-08–14 and a meal plan covering the same week
        when: the meal-prep summary for that plan is retrieved
        then: product P appears in the summary pool
        kind: happy
        policy: POL-002
        test: TestSummaryPool_WeeklySelectionAppears
      - id: AC-078
        given: product P marked for week 2026-06-08–14 and a meal plan covering 2026-06-20–26
        when: the meal-prep summary for the second plan is retrieved
        then: product P does not appear in the summary pool
        kind: negative
        test: TestSummaryPool_WeeklySelectionDoesNotCrossWeeks

  - id: FR-029
    statement: A user shall be able to add products and recipes to the meal-prep summary pool via drag-and-drop or a non-drag-and-drop alternative interaction.
    source: [US-MP-004, US-MP-009]
    acceptance:
      - id: AC-079
        given: an authenticated user and a meal plan P with item I available
        when: AddItemToSummary is submitted for item I
        then: returns HTTP 200 and item I appears in the summary pool
        kind: happy
        invariant: INV-012
        test: TestAddItemToSummary_Persists
      - id: AC-080
        given: an item I already in the summary pool
        when: AddItemToSummary is submitted again for I
        then: returns HTTP 200 and exactly one entry for I exists in the pool
        kind: idempotency
        test: TestAddItemToSummary_Idempotent

  - id: FR-030
    statement: A user shall be able to organise summary items into named sections (breakfasts, lunches, dinners, desserts, salads, snacks); sections shall be addable, deletable, and renameable.
    source: [US-MP-005]
    acceptance:
      - id: AC-081
        given: an authenticated user with a meal plan
        when: AddSummarySection is submitted with name "Breakfasts"
        then: returns HTTP 201 and "Breakfasts" appears as a section in the summary
        kind: happy
        test: TestAddSummarySection_Persists
      - id: AC-082
        given: a summary section "Breakfasts"
        when: RenameSummarySection is submitted with new name "Morning Meals"
        then: returns HTTP 200 and the section name is "Morning Meals"
        kind: happy
        test: TestRenameSummarySection_Updated
      - id: AC-083
        given: a summary section "Breakfasts" with 2 items assigned to it
        when: DeleteSummarySection is submitted
        then: returns HTTP 200 and the section (including its items' assignments) is removed
        kind: happy
        test: TestDeleteSummarySection_RemovesWithItems
      - id: AC-110
        given: a section ID that does not exist on the plan
        when: DeleteSummarySection is submitted with that ID
        then: returns HTTP 404
        kind: negative
        test: TestDeleteSummarySection_NonExistentSection

  - id: FR-031
    statement: Each day card shall start with default sections (breakfast, lunch, dinner, snacks); users shall be able to add, delete, and rename sections on any day card.
    source: [US-MP-006]
    acceptance:
      - id: AC-084
        given: a newly created meal plan with a 7-day range
        when: any day card is opened
        then: "the card has exactly 4 sections: breakfast, lunch, dinner, and snacks"
        kind: happy
        test: TestDayCard_DefaultSections
      - id: AC-085
        given: a day card with default sections
        when: AddDayCardSection is submitted with name "Late Snack"
        then: returns HTTP 201 and the day card now has 5 sections including "Late Snack"
        kind: happy
        test: TestAddDayCardSection_Persists
      - id: AC-111
        given: AddDayCardSection is submitted with an empty section name
        when: the command is processed
        then: returns HTTP 422 and no new section is created
        kind: negative
        test: TestAddDayCardSection_RejectsEmptyName

  - id: FR-032
    statement: A user shall be able to assign items from the summary pool onto day card sections; items shall remain in the summary pool after assignment.
    source: [US-MP-007]
    acceptance:
      - id: AC-086
        given: item I in the summary pool and a day card for 2026-06-10 with a "Lunch" section
        when: AssignItemToDaySection is submitted for I into 2026-06-10/Lunch
        then: returns HTTP 200, item I appears in 2026-06-10/Lunch, and I still appears in the summary pool
        kind: happy
        invariant: INV-012
        test: TestAssignItemToDaySection_SummaryUnchanged
      - id: AC-087
        given: an item I not in the summary pool
        when: AssignItemToDaySection is submitted for I
        then: returns HTTP 422 (cannot assign from outside the pool)
        kind: negative
        invariant: INV-012
        test: TestAssignItemToDaySection_RequiresItemInPool

  - id: FR-033
    statement: A user shall be able to move items between day cards and between sections on the same day card.
    source: [US-MP-008]
    acceptance:
      - id: AC-088
        given: item I on 2026-06-10/Lunch
        when: MoveItemBetweenDays is submitted, moving I to 2026-06-11/Dinner
        then: returns HTTP 200 and I appears in 2026-06-11/Dinner
        kind: happy
        test: TestMoveItemBetweenDays_AppearsInTarget
      - id: AC-112
        given: item I on 2026-06-10/Lunch (after move to 2026-06-11/Dinner)
        when: the source day card 2026-06-10 is retrieved
        then: I is absent from 2026-06-10/Lunch
        kind: happy
        test: TestMoveItemBetweenDays_RemovedFromSource
      - id: AC-113
        given: MoveItemBetweenDays is submitted for an item that does not exist on the source day card
        when: the command is processed
        then: returns HTTP 404
        kind: negative
        test: TestMoveItemBetweenDays_NonExistentItemRejected

  - id: FR-034
    statement: Removing an item from a day card section shall remove it from the summary pool only if it does not appear on any other day card.
    source: [US-MP-010]
    acceptance:
      - id: AC-089
        given: item I assigned to 2026-06-10/Lunch only (no other day cards)
        when: RemoveItemFromDaySection is submitted for 2026-06-10/Lunch
        then: I is removed from the section and also removed from the summary pool
        kind: happy
        invariant: INV-013
        policy: POL-001
        test: TestRemoveItemFromDay_RemovesSummaryIfUnused
      - id: AC-090
        given: item I assigned to both 2026-06-10/Lunch and 2026-06-11/Dinner
        when: RemoveItemFromDaySection is submitted for 2026-06-10/Lunch only
        then: I is absent from 2026-06-10/Lunch
        kind: negative
        invariant: INV-013
        policy: POL-001
        test: TestRemoveItemFromDay_KeepsSummaryIfUsedElsewhere
      - id: AC-114
        given: item I assigned to both 2026-06-10/Lunch and 2026-06-11/Dinner (after removal from 2026-06-10/Lunch)
        when: the summary pool is retrieved
        then: I still appears in the summary pool
        kind: negative
        invariant: INV-013
        test: TestRemoveItemFromDay_SummaryRetainedWhenUsedElsewhere

  - id: FR-035
    statement: A user shall be able to set the number of servings for each dish on a day card; the day card's nutrition summary shall scale with servings.
    source: [US-MP-011, US-MP-012]
    acceptance:
      - id: AC-091
        given: recipe R with 300 kcal per serving assigned to 2026-06-10/Lunch with servings=1
        when: SetDishServings is submitted with servings=3
        then: the day card's nutrition total for 2026-06-10 increases by 600 kcal (now 3×300)
        kind: happy
        invariant: INV-014
        test: TestSetDishServings_NutritionScales
      - id: AC-092
        given: a SetDishServings command with servings=0
        when: it is submitted
        then: returns HTTP 422 and servings remain unchanged
        kind: negative
        invariant: INV-014
        test: TestSetDishServings_RejectsZeroServings
      - id: AC-093
        given: a day card with 2 dishes, each 200 kcal for 1 serving
        when: the day card nutrition summary is requested
        then: total equals 400 kcal
        kind: happy
        test: TestDayCardNutrition_AggregatesTotals

  - id: FR-036
    statement: A user shall be able to generate a shopping list from the current meal plan, or refresh an existing list to reflect the current plan state without orphan items.
    source: [US-MP-013]
    acceptance:
      - id: AC-094
        given: a meal plan with recipe R (needs 200 g chicken) on Mon and Wed (2 servings each)
        when: GenerateShoppingList is submitted
        then: the shopping list contains chicken with quantity 400 g × 2 × 2 = 800 g total and EVT-035 is emitted
        kind: happy
        invariant: INV-016
        test: TestGenerateShoppingList_QuantityCorrect
      - id: AC-095
        given: an existing shopping list derived from plan P, then item I is removed from the plan
        when: RefreshShoppingList is submitted
        then: item I's product is removed (or quantity reduced) from the list; no orphan items remain
        kind: happy
        invariant: INV-015
        policy: POL-004
        test: TestRefreshShoppingList_NoOrphanItems
      - id: AC-096
        given: a meal plan with no items assigned to any day card
        when: GenerateShoppingList is submitted
        then: returns a shopping list with an empty items array and HTTP 200
        kind: boundary
        test: TestGenerateShoppingList_EmptyPlan

non_functional:
  - id: NFR-001
    category: security
    metric: authentication_required
    threshold: all state-mutating endpoints return 401 for unauthenticated requests
    condition: always
    rationale: User data (logs, plans, credentials) must be protected. All writes and reads of personal data must require a valid session.
    acceptance:
      - id: AC-097
        given: a request with no Authorization header or an expired token
        when: any state-mutating endpoint is called
        then: returns HTTP 401 and no state is changed
        kind: negative
        test: TestAuth_UnauthenticatedMutationsRejected

  - id: NFR-002
    category: security
    metric: authorization_ownership_check
    threshold: edit/delete on owned resources returns 403 for non-owners; 0 exceptions
    condition: for all product and recipe mutation commands
    rationale: Shared global catalog requires that users cannot mutate each other's entries. Zero exceptions to the ownership check is the contract.
    acceptance:
      - id: AC-098
        given: user B attempting to edit or delete a resource owned by user A
        when: UpdateProduct, DeleteProduct, UpdateRecipe, or DeleteRecipe is called
        then: returns HTTP 403 and the resource is unchanged
        kind: authz
        test: TestAuth_OwnershipEnforced

  - id: NFR-003
    category: performance
    metric: p95_latency_product_search
    threshold: 500ms
    condition: catalog containing up to 50 000 products, at 50 concurrent users
    rationale: Product and recipe search must feel responsive for daily planning use.
    acceptance:
      - id: AC-099
        given: a catalog with 50 000 products and 50 concurrent users submitting search requests
        when: the product search endpoint is called for 5 minutes sustained
        then: p95 response time <= 500ms
        kind: boundary
        test: BenchProductSearch_p95_50k

  - id: NFR-004
    category: observability
    metric: structured_logging_coverage
    threshold: 100% of commands emit a structured log entry on success and on failure
    condition: always, in production
    rationale: Without structured logs, debugging meal planning and shopping list issues is infeasible.
    acceptance:
      - id: AC-100
        given: any command is executed (success or failure path)
        when: the command handler returns
        then: exactly one structured JSON log entry with command name, actor ID, and outcome is written to stdout
        kind: happy
        test: TestLogging_AllCommandsEmitStructuredEntry

  - id: NFR-005
    category: availability
    metric: uptime_p99
    threshold: 99.5%
    condition: measured monthly, excluding planned maintenance windows
    rationale: MealPlanner is a daily-use application; extended downtime breaks shopping and planning workflows.
    acceptance:
      - id: AC-101
        given: a monthly monitoring period with planned maintenance excluded
        when: uptime is measured via health-check endpoint
        then: availability >= 99.5%
        kind: boundary
        test: MonitorUptime_99_5_Monthly

constraints:
  - id: CON-001
    type: technical
    statement: MVP1 is web-only; mobile app is explicitly out of scope. Domain architecture must remain platform-agnostic to support mobile in a future iteration.
    source: vision.md

  - id: CON-002
    type: technical
    statement: Authentication for MVP1 is email/password only. Social login (Google, Apple, etc.) is deferred and must not be implemented in MVP1.
    source: raw-requirements.md

  - id: CON-003
    type: organizational
    statement: The product catalog is pre-seeded from an external dataset (USDA FoodData Central or OpenFoodFacts; source TBD). The seeding mechanism must be a one-time bulk import, not a live integration.
    source: raw-requirements.md

  - id: CON-004
    type: organizational
    statement: Offline mode and downloading of meal plans or shopping lists are not in MVP1 scope.
    source: vision.md

  - id: CON-005
    type: technical
    statement: Recipe import uses AI-assisted parsing (OpenAI direction); the exact tech stack and model are deferred to a dedicated architecture decision and must not be hardcoded outside that ADR's approved direction.
    source: raw-requirements.md

  - id: CON-006
    type: technical
    statement: Body composition tracking is limited to simple metrics (weight, BMI). Wearable device integrations are explicitly excluded from MVP1.
    source: raw-requirements.md

  - id: CON-007
    type: organizational
    statement: The UI must support English and Ukrainian as the only two interface languages for MVP1.
    source: [US-PC-002, vision.md]
