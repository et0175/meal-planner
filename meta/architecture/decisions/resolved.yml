resolved:
  - id: DEC-004
    question: >
      Should the Nutritionist role have elevated permissions or be a profile label in MVP1?
    decision: same_permissions_as_user
    rationale: >
      No user story requires a nutritionist to act on another user's content. RBAC adds
      authz complexity without validated product need. Extend when concrete stories exist.
    adr: decisions/adr/0004-nutritionist-role-mvp1.md
    resolved_at: 2026-06-12
    blocks_lifted: []

  - id: DEC-008
    question: >
      Should Identity use a provider-agnostic AuthProvider abstraction from the start?
    decision: provider_agnostic_identity_abstraction
    rationale: >
      Social login is near-certain future requirement (deferred, not rejected). Interface
      cost in Increment 1 is lower than refactoring live auth code when the provider is added.
    adr: decisions/adr/0008-identity-auth-provider-abstraction.md
    resolved_at: 2026-06-12
    blocks_lifted: []

  - id: DEC-005
    question: >
      How should Catalog notify Meal Planning when items are marked for the week (POL-002)?
    decision: monolith_inprocess_call
    rationale: >
      Immediate consistency with zero infrastructure. Named boundary interface
      (WeeklySelectionSyncService) provides the extraction point for future service separation.
    adr: decisions/adr/0005-catalog-mealplanning-integration.md
    resolved_at: 2026-06-12
    blocks_lifted: [synthesis]

  - id: DEC-007
    question: >
      How should Nutrition Tracking and Meal Planning access nutritional data from Catalog?
    decision: shared_database_read
    rationale: >
      Zero overhead, always-current values, simplest for MVP1 monolith. Named
      CatalogReadRepository provides the extraction seam for future service separation.
    adr: decisions/adr/0007-nutrition-data-access-shared-db.md
    resolved_at: 2026-06-12
    blocks_lifted: [synthesis]

  - id: DEC-006
    question: >
      How should downstream contexts access user identity data (user_id, calorie corridor)?
    decision: jwt_claims_no_identity_call
    rationale: >
      Zero per-request latency, no runtime dependency on Identity. Staleness eliminated
      by the refresh-on-profile-update rule. No infrastructure overhead for MVP1 monolith.
    adr: decisions/adr/0006-identity-data-access-jwt.md
    resolved_at: 2026-06-12
    blocks_lifted: [synthesis]

  - id: DEC-001
    question: >
      What is the source of the pre-seeded product dataset?
    decision: openfoodfacts
    rationale: >
      Only viable option for Ukrainian market coverage. USDA is US-centric;
      custom dataset is too expensive for MVP1. Filtered import (complete macros only)
      mitigates data quality concerns.
    adr: decisions/adr/0001-product-dataset-seed.md
    resolved_at: 2026-06-12
    blocks_lifted: [synthesis]

  - id: DEC-002
    question: >
      What exact OpenAI model and API pattern should the recipe import pipeline use?
    decision: gpt4o_structured_outputs
    rationale: >
      Highest accuracy, single code path, schema enforced by the API. Cost is not
      material at MVP1 import volumes. Complexity of two-model fallback not justified yet.
    adr: decisions/adr/0002-recipe-import-openai-model.md
    resolved_at: 2026-06-12
    blocks_lifted: [synthesis]
