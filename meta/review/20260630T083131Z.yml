    severity: medium
    category: tech-debt
    type: gap
    file: backend/planning/tests/test_mealplan.py
    line: 391
    title: "Search test mocks search_catalog_products, hiding the q/search contract break"
    description: |
      test_search_recently_used_first patches mealplan.router.search_catalog_products,
      so the real catalog HTTP call (and its param name) is never exercised. That is why
      F-001 passes the suite. No test asserts the outbound catalog query param, and the
      week-format tests still pass YYYY-WW ("2026-27"), so the new YYYY-WNN path is also
