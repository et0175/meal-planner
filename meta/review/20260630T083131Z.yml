  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: backend/planning/weekflag_reader/service.py
    line: 57
    title: "Planning search sends ?q= but Catalog only reads ?search= → filter silently dropped"
    description: |
      search_catalog_products now calls GET {catalog}/products?q=<query>, but the
      catalog query router (backend/catalog/query/router.py:22) declares the param
      as `search`, with no `q` alias. FastAPI silently ignores unknown query params,
      so `search` stays None and list_products applies no name filter and has no LIMIT
      — it returns the ENTIRE non-deleted catalog. The /plan/search endpoint then sorts
      and returns all products instead of matches for `q`, breaking FR-023 (AC-062 /
      AC-121). Pre-change the call used params={"search": q} and worked.
    suggestion: |
      Align the param name. Either revert to params={"search": q}, or (preferred, since
      the frontend already sends `q`) add `q` to the catalog router — e.g.
      search: str | None = Query(default=None, alias="q") — and update its callers
      consistently.
    confidence: high
    source: static
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
