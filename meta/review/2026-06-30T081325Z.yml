    title: "Week format inconsistency — shopping planning client not updated"
    description: |
      _iso_weeks_in_range() still generates "YYYY-WW" strings (e.g. "2026-27").
      When Shopping calls Planning for the current week, mealplan/router.py:62 compares
      resolved_week ("2026-27") == current_week ("2026-W27") → False, so
      week_flagged_products are silently skipped. Shopping doesn't consume this field
      today, but the format mismatch is a latent bug for any future consumer.
    suggestion: |
      Change line 35 from:
        week_str = f"{iso.year}-{iso.week:02d}"
      to:
        week_str = f"{iso.year}-W{iso.week:02d}"
    confidence: high
    source: static
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null

  - id: F-002
    severity: medium
    category: compliance
    type: risk
    file: backend/identity/main.py
    line: 30
    title: "CORS allow_origins=['*'] too permissive for production"
    description: |
      All 4 services use allow_origins=["*"] without origin restriction.
      While Bearer-token auth (not cookies) limits practical CSRF risk,
      any web page can call auth endpoints from a browser. Must be narrowed
      to the Vercel deployment origin before Railway production deploy.
      Same issue in backend/catalog/main.py:52, backend/planning/main.py:36,
      backend/shopping/main.py:36.
    suggestion: |
      Use env-var-driven origin list in each service main.py:
        origins = os.getenv("CORS_ORIGINS", "*").split(",")
        app.add_middleware(CORSMiddleware, allow_origins=origins, ...)
      Set CORS_ORIGINS=https://your-app.vercel.app in Railway env.
    confidence: high
    source: static
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null

