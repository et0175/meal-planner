line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E/F = pycodestyle/pyflakes, I = isort, UP = pyupgrade, B = flake8-bugbear, SIM = simplify

[lint.per-file-ignores]
"*/tests/*" = ["S101"]  # allow assert in tests

[format]
quote-style = "double"
indent-style = "space"
