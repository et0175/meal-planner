# Actors — OQ-005 resolved (2026-06-17): Nutritionist post-MVP1 permissions are defined in open-questions.md
actors:
  - id: ACT-001
    name: User
    type: human
    description: An authenticated individual who browses products and recipes, plans weekly meals, logs food intake, and manages personal catalog entries.

  - id: ACT-002
    name: Nutritionist
    type: human
    description: A professional user who curates products and recipes. In MVP1, shares the same system permissions as a regular User. Post-MVP1 differentiations planned — create and edit meal plans on behalf of other users; annotate diet compatibility on any user's products/recipes (🚫 deferred further — the Dietary Analyser module itself, which this depends on, is now deferred to post-MVP1; see OQ-011 in open-questions.md).

  - id: ACT-003
    name: System
    type: system
    description: Internal automated actor that performs derived computations such as nutrition aggregation, calorie corridor calculation, and shopping list refresh triggered by plan changes.